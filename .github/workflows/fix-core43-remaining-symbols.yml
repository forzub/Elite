name: Fix remaining OpenGL 4.3 Core symbols

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
    paths:
      - .github/workflows/fix-core43-remaining-symbols.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mae-v01075-semantic-workflow-motion-v5
          fetch-depth: 0

      - name: Remove remaining fixed-function state
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected replacement count 1, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          cloud = "src/render/celestial/clouds/HubBackdropCloudRenderer.cpp"
          replace_once(
              cloud,
              '''        GLint oldTextureEnvMode =\n            GL_MODULATE;\n\n        glGetTexEnviv(\n            GL_TEXTURE_ENV,\n            GL_TEXTURE_ENV_MODE,\n            &oldTextureEnvMode\n        );\n\n        glTexEnvi(\n            GL_TEXTURE_ENV,\n            GL_TEXTURE_ENV_MODE,\n            GL_MODULATE\n        );\n\n''',
              '''        // OpenGL Core has no fixed-function texture environment.\n        // CoreGlLegacyBridge already implements the old GL_MODULATE behavior\n        // explicitly in GLSL as texture(uTexture, vTexCoord) * vColor.\n\n'''
          )
          replace_once(
              cloud,
              '''        glTexEnvi(\n            GL_TEXTURE_ENV,\n            GL_TEXTURE_ENV_MODE,\n            oldTextureEnvMode\n        );\n\n''',
              ''''''
          )

          planet = "src/game/system_map/DetailMapPlanetPass.cpp"
          replace_once(
              planet,
              '''    GLboolean alphaTestWasEnabled =\n        glIsEnabled(\n            GL_ALPHA_TEST\n        );\n\n\n\n\n\n\n\n''',
              '''    // Alpha test was removed from the Core profile. This path is\n    // intentionally opaque, so there is no alpha-test state to preserve.\n\n'''
          )
          replace_once(
              planet,
              '''    // Shape model должен быть opaque.\n    // Blend/alpha-test дают эффект дыр, просвечивания и "внутренней" текстуры.\n    glDisable(\n        GL_BLEND\n    );\n\n    glDisable(\n        GL_ALPHA_TEST\n    );\n\n    // Shape model должен быть opaque.\n    // Blend даёт эффект "текстура видна изнутри".\n    glDisable(\n        GL_BLEND\n    );\n''',
              '''    // Shape model должен быть opaque.\n    // В Core profile alpha test отсутствует; непрозрачность задаётся самим\n    // draw path, поэтому здесь достаточно отключить blending.\n    glDisable(\n        GL_BLEND\n    );\n'''
          )
          replace_once(
              planet,
              '''\n\n\n    if (alphaTestWasEnabled)\n        glEnable(GL_ALPHA_TEST);\n    else\n        glDisable(GL_ALPHA_TEST);\n\n\n\n\n\n\n\n''',
              '''\n\n'''
          )

          contract = "tests/architecture_contracts/check_gl43_modernization_boundary.py"
          p = Path(contract)
          text = p.read_text(encoding="utf-8")
          anchor = '''    "fixed-texture-enable": re.compile(\n        r"\\bgl(?:Enable|Disable|IsEnabled)\\s*\\(\\s*GL_TEXTURE_2D\\s*\\)"\n    ),\n'''
          insertion = anchor + '''    "fixed-texture-env-call": re.compile(r"\\bgl(?:Get)?TexEnv[a-zA-Z]*\\s*\\("),\n    "fixed-alpha-test-call": re.compile(r"\\bglAlphaFunc\\s*\\("),\n    "GL_TEXTURE_ENV": re.compile(r"\\bGL_TEXTURE_ENV(?:_MODE)?\\b"),\n    "GL_MODULATE": re.compile(r"\\bGL_MODULATE\\b"),\n    "GL_ALPHA_TEST": re.compile(r"\\bGL_ALPHA_TEST(?:_FUNC|_REF)?\\b"),\n'''
          if text.count(anchor) != 1:
              raise SystemExit("architecture contract anchor not found exactly once")
          text = text.replace(anchor, insertion, 1)

          marker = '''glad_header = (ROOT / "glad/include/glad/gl.h").read_text(encoding="utf-8")\nassert "gl:core=4.3" in glad_header\nassert "gl:compatibility=4.3" not in glad_header\n'''
          addition = marker + '''\n# Mechanical Core-header coverage: every raw OpenGL function/constant used by\n# production sources must actually exist in the bundled Core 4.3 GLAD header.\n# This catches compatibility leftovers even when they were not named manually\n# in COMPATIBILITY_PATTERNS above.\nmissing_core_symbols = {}\nfor path in SRC.rglob("*"):\n    if not path.is_file() or path.suffix.lower() not in SOURCE_SUFFIXES:\n        continue\n    relative = path.relative_to(ROOT).as_posix()\n    source = strip_cpp_comments(path.read_text(encoding="utf-8"))\n    functions = sorted(set(re.findall(r"\\b(gl[A-Z][A-Za-z0-9_]*)\\s*\\(", source)))\n    constants = sorted(set(re.findall(r"\\b(GL_[A-Z0-9_]+)\\b", source)))\n    missing = [token for token in functions + constants if token not in glad_header]\n    if missing:\n        missing_core_symbols[relative] = missing\n\nassert not missing_core_symbols, (\n    "Production code references symbols absent from bundled OpenGL 4.3 Core GLAD: "\n    + repr(missing_core_symbols)\n)\n'''
          if text.count(marker) != 1:
              raise SystemExit("GLAD contract marker not found exactly once")
          text = text.replace(marker, addition, 1)
          p.write_text(text, encoding="utf-8")

      - name: Run architecture contracts
        run: |
          python tests/architecture_contracts/check_gl43_modernization_boundary.py
          python tests/architecture_contracts/check_system_map_static_sphere.py
          python tests/architecture_contracts/check_system_map_gpu_circles.py
          git diff --check

      - name: Commit migration and remove one-shot workflow
        run: |
          rm .github/workflows/fix-core43-remaining-symbols.yml
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "render: remove remaining Core 4.3 fixed-function state"
          git push origin HEAD:chatgpt/mae-v01075-semantic-workflow-motion-v5
