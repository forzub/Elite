name: P0 Sphere Fix Windows Syntax

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glm
            mingw-w64-x86_64-nlohmann-json
      - name: Core boundary
        shell: pwsh
        run: python tests/architecture_contracts/check_gl43_modernization_boundary.py
      - name: Static sphere contract
        shell: pwsh
        run: python tests/architecture_contracts/check_system_map_static_sphere.py
      - name: Compile SystemMapRenderer translation unit
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -DGLM_ENABLE_EXPERIMENTAL \
            -I. -Isrc -Iglad/include \
            -Ithird_party/websocketpp -Ithird_party/asio/asio/include \
            $(pkg-config --cflags freetype2) \
            -fsyntax-only src/game/system_map/SystemMapRenderer.cpp
