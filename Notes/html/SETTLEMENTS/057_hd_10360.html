<!-- NARRATIVE:places -->

- **p Eridani A n — поселение.** Холодный мир (~102 K) с метановой атмосферой: метан и лёд для заправки [PROPOSAL].
- **p Eridani A o — поселение.** Дальний ледяной мир (~66 K): ледовые промыслы, склады, дешёвое жильё [PROPOSAL].
