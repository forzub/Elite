name: Patch live docking guidance path

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
    paths:
      - .github/workflows/nav_live_guidance_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mae-v01075-semantic-workflow-motion-v5
          fetch-depth: 0

      - name: Apply live path patch
        run: python tools/patch_live_guidance_tmp.py

      - name: Verify patch
        run: |
          python tests/architecture_contracts/check_live_docking_guidance.py
          python tests/architecture_contracts/check_ruckig_navigation_integration.py
          git diff --check

      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/nav_live_guidance_fix.yml tools/patch_live_guidance_tmp.py
          git add src/game/SpaceState.cpp src/game/SpaceState.h tests/architecture_contracts/check_live_docking_guidance.py
          git commit -m "navigation: refresh live docking tunnel from current pose"
          git push origin HEAD:chatgpt/mae-v01075-semantic-workflow-motion-v5
