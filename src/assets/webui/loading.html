<!doctype html>
<html class="elite-ui-boot">
<head>
  <meta charset="utf-8">
  <title>EliteGame Loading</title>
  <style id="elite-critical-boot">html,body{margin:0;background:#010208}html.elite-ui-boot body{visibility:hidden;opacity:0}</style>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 25%, rgba(40, 140, 210, 0.18), transparent 34%),
        linear-gradient(180deg, #040913 0%, #00030a 100%);
      color: rgba(210, 235, 255, 0.92);
      font-family: Arial, sans-serif;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      padding: 56px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .title {
      font-size: 30px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hint {
      max-width: 760px;
      color: rgba(170, 210, 235, 0.58);
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .barOuter {
      width: min(620px, 70vw);
      height: 12px;
      border: 1px solid rgba(120, 220, 255, 0.46);
      background: rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .barInner {
      height: 100%;
      width: 0%;
      background: rgba(110, 220, 255, 0.88);
      transition: width 0.18s ease;
    }

    .row {
      margin-top: 10px;
      width: min(620px, 70vw);
      display: flex;
      justify-content: space-between;
      color: rgba(170, 210, 235, 0.55);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .stageTerminal {
      min-width: 0;
      display: inline-flex;
      align-items: baseline;
      font-family: "Courier New", "Microsoft YaHei UI", "Yu Gothic UI", monospace;
      white-space: pre;
    }

    .terminalCursor {
      display: none;
      width: 0.68em;
      height: 0.96em;
      margin-left: 0.16em;
      transform: translateY(0.12em);
      background: currentColor;
      animation: terminalCursorBlink 0.78s steps(1, end) infinite;
    }

    .terminalCursor.active {
      display: inline-block;
    }

    @keyframes terminalCursorBlink {
      0%, 54% { opacity: 1; }
      55%, 100% { opacity: 0; }
    }

    .cancelRow {
      width: min(620px, 70vw);
      margin-top: 18px;
    }

    .cancelRow .elite-button {
      width: min(260px, 100%);
    }
  </style>
  <link rel="stylesheet" href="/elite_ui.css">
  <script src="/elite_ui.js"></script>
</head>

<body>
  <div class="screen">
    <div class="title" data-i18n="loading.title">INITIALIZING FLIGHT SYSTEMS</div>

    <div class="hint" id="hint" data-i18n="loading.hint">
      Warming up reactor control. Loading telemetry. Aligning local frame.
    </div>

    <div class="barOuter">
      <div id="bar" class="barInner"></div>
    </div>

    <div class="row">
      <span class="stageTerminal">
        <span id="stageText">BOOT</span><span id="stageCursor" class="terminalCursor" aria-hidden="true"></span>
      </span>
      <span id="percent">0%</span>
    </div>

    <div id="cancelRow" class="cancelRow" hidden>
      <button id="cancelConnection" class="elite-button elite-button--secondary" data-i18n="loading.cancel_connection">CANCEL CONNECTION</button>
    </div>
  </div>

  <script src="/game_i18n.js"></script>
  <script>
    const sessionKind = new URLSearchParams(location.search).get("session") || "unknown";
    let currentStageKey = "loading.boot";
    let loadingPreparedSent = false;
    let currentStageFallback = "BOOT";
    let stageAnimationGeneration = 0;

    const stageText = document.getElementById("stageText");
    const stageCursor = document.getElementById("stageCursor");

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function localizedStageText() {
      return window.GameI18n
        ? GameI18n.t(currentStageKey, currentStageFallback)
        : currentStageFallback;
    }

    function waitingForServer() {
      return currentStageKey === "loading.stage.waiting_server";
    }

    function connectionCancelable() {
      if (sessionKind !== "remote") return false;
      return currentStageKey === "loading.stage.connecting" ||
        currentStageKey === "loading.stage.waiting_server" ||
        currentStageKey === "loading.stage.sync";
    }

    function updateCancelConnection() {
      const row = document.getElementById("cancelRow");
      const button = document.getElementById("cancelConnection");
      const visible = connectionCancelable();
      row.hidden = !visible;
      if (visible) button.disabled = false;
    }

    async function runPc286Typewriter(generation, text) {
      while (generation === stageAnimationGeneration && waitingForServer()) {
        stageText.textContent = "";
        for (const ch of Array.from(text)) {
          if (generation !== stageAnimationGeneration || !waitingForServer()) return;
          stageText.textContent += ch;
          await sleep(ch === " " ? 70 : 42);
        }

        await sleep(1350);
        if (generation !== stageAnimationGeneration || !waitingForServer()) return;
        stageText.textContent = "";
        await sleep(420);
      }
    }

    async function typeComposition(generation, committed, pinyin) {
      let composition = "";
      for (const ch of Array.from(pinyin)) {
        if (generation !== stageAnimationGeneration || !waitingForServer()) return false;
        composition += ch;
        stageText.textContent = committed + (committed ? " " : "") + composition;
        await sleep(ch === " " ? 85 : 48);
      }
      return true;
    }

    async function runChineseIme(generation) {
      // Visual imitation of a desktop pinyin IME: phonetic composition appears
      // first, then committed words replace it with Han characters. This is
      // presentation only; the C++ session state remains language-neutral.
      const segments = [
        ["zheng zai", "正在"],
        ["deng dai", "等待"],
        ["fu wu qi", "服务器"]
      ];

      while (generation === stageAnimationGeneration && waitingForServer()) {
        let committed = "";
        stageText.textContent = "";

        for (const [pinyin, hanzi] of segments) {
          if (!await typeComposition(generation, committed, pinyin)) return;
          await sleep(180);
          if (generation !== stageAnimationGeneration || !waitingForServer()) return;
          committed += hanzi;
          stageText.textContent = committed;
          await sleep(210);
        }

        await sleep(1350);
        if (generation !== stageAnimationGeneration || !waitingForServer()) return;
        stageText.textContent = "";
        await sleep(420);
      }
    }

    function renderLoadingStage(restartAnimation = false) {
      const text = localizedStageText();
      const activeWaiting = waitingForServer();

      if (!activeWaiting) {
        ++stageAnimationGeneration;
        stageCursor.classList.remove("active");
        stageText.textContent = text;
        return;
      }

      if (!restartAnimation && stageCursor.classList.contains("active")) return;

      const generation = ++stageAnimationGeneration;
      stageCursor.classList.add("active");

      const locale = window.GameI18n ? GameI18n.locale() : "en";
      if (locale === "zh-Hans")
        void runChineseIme(generation);
      else
        void runPc286Typewriter(generation, text);
    }

    async function setLoadingProgress(value, stageKey, englishFallback) {
      const p = Math.max(0, Math.min(100, Math.round(value * 100)));
      document.getElementById("bar").style.width = p + "%";
      document.getElementById("percent").textContent = p + "%";

      const stageChanged = !!stageKey && stageKey !== currentStageKey;
      if (stageKey) {
        currentStageKey = stageKey;
        currentStageFallback = englishFallback || stageKey;
      }

      renderLoadingStage(stageChanged);
      updateCancelConnection();

      if (!loadingPreparedSent) {
        await window.EliteUiKit.waitForDocumentDependencies();
        await window.EliteUiKit.settlePreparedLayout();
        loadingPreparedSent = true;
        if (window.gameCommand) await window.gameCommand("loading_ui_prepared");
      }
    }

    window.addEventListener("game-ui-language-changed", () => {
      renderLoadingStage(true);
    });

    document.getElementById("cancelConnection").addEventListener("click", async () => {
      const button = document.getElementById("cancelConnection");
      button.disabled = true;
      if (window.gameCommand) await window.gameCommand("session_cancel");
    });

    window.addEventListener("DOMContentLoaded", async () => {
      await window.EliteUiKit.waitForDocumentDependencies();
      // Native owns the authoritative stage/progress. Keep this page hidden
      // until it explicitly applies the first cached progress state.
      if (window.gameCommand) await window.gameCommand("loading_ui_ready");
    }, { once: true });
  </script>
</body>
</html>
