name: GL43 Core Windows Syntax

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glm
      - name: Core boundary
        shell: msys2 {0}
        run: python tests/architecture_contracts/check_gl43_modernization_boundary.py
      - name: Compile Core legacy bridge header
        shell: msys2 {0}
        run: |
          printf '#include "src/render/legacy/CoreGlLegacyBridge.h"\nint main(){return 0;}\n' > gl43_bridge_syntax.cpp
          g++ -std=c++17 -DGLM_ENABLE_EXPERIMENTAL -I. -Iglad/include -fsyntax-only gl43_bridge_syntax.cpp
