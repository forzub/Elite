name: GL43 Core Migration

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install glad 2.0.8
        run: python -m pip install --disable-pip-version-check glad2==2.0.8
      - name: Migrate production source to Core bridge
        run: python tools/gl43_core_migrate.py
      - name: Generate bundled GLAD 4.3 Core
        shell: bash
        run: |
          rm -rf /tmp/glad-core
          glad --api='gl:core=4.3' --extensions='' c --loader --out-path=/tmp/glad-core
          cp /tmp/glad-core/include/glad/gl.h glad/include/glad/gl.h
          cp /tmp/glad-core/src/gl.c glad/src/gl.c
      - name: Verify GL43 Core boundary
        run: python tests/architecture_contracts/check_gl43_modernization_boundary.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit migration result
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'Kostiantyn Zubchenko [FE-30]'
          git config user.email '90088507+forzub@users.noreply.github.com'
          git add -A
          git commit -m 'render: complete OpenGL 4.3 Core API migration'
          git push origin HEAD:chatgpt/mae-v01075-semantic-workflow-motion-v5
