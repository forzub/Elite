name: MAE localization completeness

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
    paths:
      - '.github/mae_i18n_finish.py'
      - '.github/workflows/mae_i18n_finish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply localization completeness pass
        run: |
          python .github/mae_i18n_finish.py
          python - <<'PY'
          from pathlib import Path
          import json
          cat=Path('src/assets/localization/ui/tools/model_asset_editor.json')
          data=json.loads(cat.read_text(encoding='utf-8'))
          s=data['strings']
          s['model_editor.status.active_lod'].update({
            'ru':'{stage}: активный LOD{lod}',
            'es':'{stage}: LOD activo {lod}',
            'ja':'{stage}: アクティブ LOD{lod}'
          })
          s['model_editor.overlay.render']['es']='renderizado LOD{lod}'
          s['model_editor.storage.working_lod'].update({
            'ru':'рабочий LOD{lod} .elmesh (WORKING)',
            'zh-Hans':'WORKING 的 LOD{lod} .elmesh',
            'es':'LOD{lod} .elmesh de WORKING',
            'ja':'WORKING の LOD{lod} .elmesh'
          })
          cat.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          contract=Path('tests/architecture_contracts/check_model_asset_editor_localization.py')
          text=contract.read_text(encoding='utf-8')
          text=text.replace(" (r\"WORKING ASSET is the saved editor resume state\",'storage help'),\n","")
          contract.write_text(text,encoding='utf-8')
          PY

      - name: Validate diff and catalog
        run: |
          git diff --check
          python -m json.tool src/assets/localization/ui/tools/model_asset_editor.json >/dev/null

      - name: Full architecture gate
        run: |
          python tests/architecture_contracts/check_model_asset_editor_application_state.py
          python tests/architecture_contracts/check_model_asset_editor_orchestration_layers.py
          python tests/architecture_contracts/check_model_asset_editor_transport_layers.py
          python tests/architecture_contracts/check_model_asset_editor_session_layers.py
          python tests/architecture_contracts/check_model_asset_editor_viewport_layers.py
          python tests/architecture_contracts/check_model_asset_editor_viewport_adapters.py
          python tests/architecture_contracts/check_model_asset_editor_view_state_layers.py
          python tests/architecture_contracts/check_model_asset_editor_shell_architecture.py
          python tests/architecture_contracts/check_model_asset_editor_localization.py
          python tests/architecture_contracts/check_model_asset_semantics_workspace_layout.py

      - name: JavaScript syntax
        run: |
          node --check src/assets/webui/model_asset_editor/i18n/catalog.js
          node --check src/assets/webui/model_asset_editor/i18n/dom.js
          node --check src/assets/webui/model_asset_editor/effects/i18n.js
          node --check src/assets/webui/model_asset_editor/effects/lod_runtime.js
          node --check src/assets/webui/model_asset_editor/effects/semantics.js
          node --check src/assets/webui/model_asset_editor/effects/ui_chrome.js
          node --check src/assets/webui/model_asset_editor/viewport/attachments.js

      - name: Localization coverage audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          cat=json.loads((root/'src/assets/localization/ui/tools/model_asset_editor.json').read_text(encoding='utf-8'))
          locales=['ru','zh-Hans','es','ja']
          strings=cat['strings']
          print('CATALOG_KEYS',len(strings))
          for locale in locales:
              copied=[]
              for key,row in strings.items():
                  en=str(row.get('en','')).strip(); loc=str(row.get(locale,'')).strip()
                  if len(re.findall(r'[A-Za-z]{3,}',en))>=3 and en==loc:
                      copied.append(key)
              print(locale,'FULL_ENGLISH_PROSE',len(copied))
              for key in copied[:20]: print(' COPIED',key)
          html=(root/'src/assets/webui/model_asset_editor.html').read_text(encoding='utf-8')
          for label,pat in [
              ('DIRECT_LOCALSTATUS',r"localStatus\(\s*(?:`|'|\")"),
              ('DIRECT_CONFIRM',r"confirm\(\s*(?:`|'|\")"),
          ]:
              hits=list(re.finditer(pat,html))
              print(label,len(hits))
          assert all(not (len(re.findall(r'[A-Za-z]{3,}',str(row.get('en','')).strip()))>=3 and str(row.get(loc,'')).strip()==str(row.get('en','')).strip()) for row in strings.values() for loc in locales)
          print('LOCALIZATION COMPLETENESS AUDIT: PASS')
          PY

      - name: Commit verified localization completeness
        run: |
          rm -f .github/mae_i18n_finish.py
          rm -f .github/workflows/mae_i18n_finish.yml
          git add -A
          git diff --cached --check
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'model asset editor: finish localization coverage'
          git push origin HEAD:chatgpt/mae-v01075-semantic-workflow-motion-v5
