<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EliteGame Main Menu</title>
  <link rel="stylesheet" href="/elite_ui.css">
  <script src="/elite_ui.js"></script>
</head>
<body class="elite-ui-body">
  <div class="elite-screen">
    <main id="main-shell" class="elite-panel elite-panel--centered" data-elite-shell aria-live="polite">
      <header>
        <h1 class="elite-title">ELITE</h1>
        <div class="elite-subtitle" data-i18n="main.subtitle">HTML GAME UI PROTOTYPE</div>
      </header>

      <section id="main-actions" class="elite-view elite-actions" data-elite-view="home" aria-label="Main menu">
        <button class="elite-button" data-elite-autofocus data-i18n="main.new_local_game" onclick="sendCommand('new_local_game')">NEW LOCAL GAME</button>
        <button class="elite-button" data-i18n="main.load_local_game" onclick="sendCommand('load_local_game')">LOAD LOCAL GAME</button>
        <button class="elite-button" data-i18n="main.multiplayer" onclick="sendCommand('multiplayer')">MULTIPLAYER</button>
        <button class="elite-button elite-button--secondary" data-i18n="main.exit" onclick="sendCommand('exit')">EXIT</button>
      </section>

      <section id="multiplayer-connection" class="elite-view" data-elite-view="multiplayer" aria-label="Multiplayer authorization" hidden>
        <div class="elite-form">
          <div class="elite-field">
            <label class="elite-field-label" for="server-endpoint" data-i18n="main.server_address">SERVER ADDRESS</label>
            <input class="elite-input" id="server-endpoint" value="127.0.0.1:27351" spellcheck="false" autocomplete="off">
          </div>

          <div class="elite-field" id="account-handle-field">
            <label class="elite-field-label" for="credential-profile" data-i18n="main.account_handle">ACCOUNT HANDLE</label>
            <input class="elite-input" id="credential-profile" value="" spellcheck="false" autocomplete="username" inputmode="text" minlength="3" maxlength="24" pattern="[a-z0-9][a-z0-9_-]{2,23}" data-elite-autofocus>
            <div class="elite-field-help" data-i18n="main.account_handle_rules">3-24 characters: lowercase a-z, digits, _ and -. Start with a letter or digit.</div>
          </div>

          <div id="connection-error" class="elite-banner" role="alert" aria-live="assertive" aria-hidden="true" hidden></div>

          <div class="elite-actions">
            <button class="elite-button" data-i18n="main.sign_in" onclick="authorizeMultiplayer(false)">SIGN IN</button>
            <button class="elite-button" data-i18n="main.register" onclick="authorizeMultiplayer(true)">REGISTER</button>
            <button class="elite-button elite-button--secondary" data-i18n="main.back" onclick="sendCommand('multiplayer_back')">BACK</button>
          </div>
        </div>
      </section>

      <div class="elite-hint" data-i18n="main.hint">WebView layer. Not the debug browser.</div>
    </main>
  </div>

  <script src="/game_i18n.js"></script>
  <script>
    let mainMenuShell = null;
    let connectionErrorCode = '';

    async function sendCommand(command) {
      if (window.gameCommand) {
        await window.gameCommand(command);
      } else {
        console.log('gameCommand bridge not found:', command);
      }
    }

    const connectionErrorI18nKeys = {
      INVALID_CREDENTIAL: 'main.auth.invalid_credential',
      UNKNOWN_ACCOUNT: 'main.auth.unknown_account',
      INVALID_ACCOUNT_HANDLE: 'main.auth.invalid_account_handle',
      ACCOUNT_HANDLE_TAKEN: 'main.auth.account_handle_taken',
      ACCOUNT_HANDLE_REQUIRED: 'main.auth.account_handle_required',
      SERVER_ADDRESS_REQUIRED: 'main.auth.server_address_required',
      INVALID_SERVER_ADDRESS: 'main.auth.invalid_server_address',
      LOCAL_CREDENTIAL_MISSING: 'main.auth.local_credential_missing',
      REGISTRATION_UNAVAILABLE: 'main.auth.registration_unavailable',
      ALREADY_ACTIVE: 'main.auth.already_active',
      SESSION_UNAVAILABLE: 'main.auth.session_unavailable',
      BOOTSTRAP_FAILED: 'main.auth.bootstrap_failed'
    };

    function setConnectionError(code) {
      connectionErrorCode = code || '';
      const key = connectionErrorI18nKeys[connectionErrorCode];
      const text = connectionErrorCode
        ? (key ? window.GameI18n.t(key, connectionErrorCode) : connectionErrorCode)
        : '';
      window.EliteUiKit.setBanner('#connection-error', text, 'error');
    }

    function applyMainMenuState(state) {
      if (!mainMenuShell) return;
      const next = state || {};
      const endpoint = document.getElementById('server-endpoint');
      const account = document.getElementById('credential-profile');

      if (typeof next.endpoint === 'string' && next.endpoint) endpoint.value = next.endpoint;
      if (typeof next.accountHandle === 'string') account.value = next.accountHandle;
      setConnectionError(next.errorCode || '');

      if (next.view === 'multiplayer') {
        mainMenuShell.show('multiplayer', { focus: account, select: true });
      } else {
        mainMenuShell.show('home', { focus: '#main-actions [data-elite-autofocus]' });
      }
    }

    // Compatibility wrappers for tooling and old call sites while native code
    // migrates to the single applyMainMenuState() navigation contract.
    function showMultiplayerForm() {
      applyMainMenuState({
        view: 'multiplayer',
        endpoint: document.getElementById('server-endpoint').value,
        accountHandle: document.getElementById('credential-profile').value,
        errorCode: connectionErrorCode
      });
    }

    function showMainMenu() {
      applyMainMenuState({ view: 'home' });
    }

    function setMultiplayerDefaults(endpoint, profile) {
      if (endpoint) document.getElementById('server-endpoint').value = endpoint;
      document.getElementById('credential-profile').value = profile || '';
    }

    async function authorizeMultiplayer(register) {
      const endpoint = document.getElementById('server-endpoint').value.trim();
      const profile = document.getElementById('credential-profile').value.trim();
      if (!endpoint) {
        setConnectionError('SERVER_ADDRESS_REQUIRED');
        return;
      }
      if (!profile) {
        setConnectionError('ACCOUNT_HANDLE_REQUIRED');
        return;
      }
      if (!/^[a-z0-9][a-z0-9_-]{2,23}$/.test(profile)) {
        setConnectionError('INVALID_ACCOUNT_HANDLE');
        return;
      }

      setConnectionError('');
      await sendCommand(
        (register ? 'multiplayer_register|' : 'multiplayer_signin|') +
        endpoint + '|' + profile
      );
    }

    document.getElementById('credential-profile').addEventListener('input', event => {
      const input = event.target;
      let value = input.value.toLowerCase().replace(/[^a-z0-9_-]/g, '');
      value = value.replace(/^[^a-z0-9]+/, '').slice(0, 24);
      if (input.value !== value) input.value = value;
      window.EliteUiKit.setFieldError('#account-handle-field', '');
    });

    for (const id of ['server-endpoint', 'credential-profile']) {
      document.getElementById(id).addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          authorizeMultiplayer(false);
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          sendCommand('multiplayer_back');
        }
      });
    }

    window.addEventListener('game-ui-language-changed', () => {
      if (connectionErrorCode) setConnectionError(connectionErrorCode);
    });

    window.addEventListener('DOMContentLoaded', () => {
      window.EliteUiKit.initialize(document);
      mainMenuShell = window.EliteUiKit.createNavigationShell('#main-shell');
      mainMenuShell.show('home');

      // C++ may have navigated here from loading.html after an auth/session
      // rejection. Native state is applied only after this shell is ready.
      sendCommand('main_menu_ready');
    });

    window.applyMainMenuState = applyMainMenuState;
  </script>
</body>
</html>
