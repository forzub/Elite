<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EliteGame Main Menu</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(55, 95, 155, 0.25), transparent 34%),
        linear-gradient(180deg, #070a10 0%, #010208 100%);
      color: #dce7ff;
      font-family: Arial, sans-serif;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: 460px;
      padding: 44px;
      border: 1px solid rgba(140, 180, 255, 0.35);
      border-radius: 18px;
      background: rgba(5, 10, 20, 0.88);
      box-shadow: 0 0 80px rgba(60, 120, 255, 0.18);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      letter-spacing: 0.28em;
      font-size: 44px;
      font-weight: 500;
    }

    .subtitle {
      margin-bottom: 34px;
      color: #7f8da8;
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    button {
      display: block;
      width: 100%;
      margin: 14px 0;
      padding: 16px 20px;
      border: 1px solid rgba(150, 190, 255, 0.45);
      border-radius: 10px;
      background: rgba(18, 35, 65, 0.9);
      color: #e8eefc;
      font-size: 17px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    button:hover {
      background: rgba(45, 80, 135, 0.98);
      box-shadow: 0 0 24px rgba(70, 130, 255, 0.25);
    }

    .hint {
      margin-top: 28px;
      color: #58647a;
      font-size: 12px;
    }

    .connection {
      display: none;
      margin-top: 18px;
      text-align: left;
    }

    .connection label {
      display: block;
      margin-bottom: 8px;
      color: #9eb2d6;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .connection input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(150, 190, 255, 0.45);
      border-radius: 8px;
      background: rgba(4, 9, 18, 0.95);
      color: #e8eefc;
      font-size: 16px;
    }

    .connection-error {
      min-height: 18px;
      margin-top: 10px;
      color: #ff9b9b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="panel">
      <h1>ELITE</h1>
      <div class="subtitle" data-i18n="main.subtitle">HTML GAME UI PROTOTYPE</div>

      <div id="main-actions">
        <button data-i18n="main.new_local_game" onclick="sendCommand('new_local_game')">NEW LOCAL GAME</button>
        <button data-i18n="main.load_local_game" onclick="sendCommand('load_local_game')">LOAD LOCAL GAME</button>
        <button data-i18n="main.multiplayer" onclick="sendCommand('multiplayer')">MULTIPLAYER</button>
        <button data-i18n="main.exit" onclick="sendCommand('exit')">EXIT</button>
      </div>

      <div id="multiplayer-connection" class="connection">
        <label for="server-endpoint" data-i18n="main.server_address">SERVER ADDRESS</label>
        <input id="server-endpoint" value="127.0.0.1:27351" spellcheck="false" autocomplete="off">
        <label for="credential-profile" data-i18n="main.credential_profile" style="margin-top:14px">CREDENTIAL PROFILE</label>
        <input id="credential-profile" value="default" spellcheck="false" autocomplete="off" maxlength="64">
        <div id="connection-error" class="connection-error"></div>
        <button data-i18n="main.sign_in" onclick="authorizeMultiplayer(false)">SIGN IN</button>
        <button data-i18n="main.register" onclick="authorizeMultiplayer(true)">REGISTER</button>
        <button data-i18n="main.back" onclick="sendCommand('multiplayer_back')">BACK</button>
      </div>

      <div class="hint" data-i18n="main.hint">WebView layer. Not the debug browser.</div>
    </div>
  </div>

  <script src="/game_i18n.js"></script>
  <script>
    async function sendCommand(command) {
      if (window.gameCommand) {
        await window.gameCommand(command);
      } else {
        console.log("gameCommand bridge not found:", command);
      }
    }

    function setMultiplayerDefaults(endpoint, profile) {
      if (endpoint) document.getElementById('server-endpoint').value = endpoint;
      if (profile) document.getElementById('credential-profile').value = profile;
    }

    function showMultiplayerForm() {
      document.getElementById('main-actions').style.display = 'none';
      document.getElementById('multiplayer-connection').style.display = 'block';
      setConnectionError('');
      const input = document.getElementById('credential-profile');
      input.focus();
      input.select();
    }

    function showMainMenu() {
      document.getElementById('multiplayer-connection').style.display = 'none';
      document.getElementById('main-actions').style.display = 'block';
      setConnectionError('');
    }

    const connectionErrorI18nKeys = {
      INVALID_CREDENTIAL: 'main.auth.invalid_credential',
      UNKNOWN_CREDENTIAL: 'main.auth.unknown_credential',
      REGISTRATION_UNAVAILABLE: 'main.auth.registration_unavailable',
      ALREADY_ACTIVE: 'main.auth.already_active',
      SESSION_UNAVAILABLE: 'main.auth.session_unavailable',
      BOOTSTRAP_FAILED: 'main.auth.bootstrap_failed'
    };

    let connectionErrorCode = '';

    function setConnectionError(message) {
      connectionErrorCode = message || '';
      const key = connectionErrorI18nKeys[connectionErrorCode];
      document.getElementById('connection-error').textContent = key
        ? window.GameI18n.t(key, connectionErrorCode)
        : connectionErrorCode;
    }

    window.addEventListener('game-ui-language-changed', () => {
      if (connectionErrorCode) setConnectionError(connectionErrorCode);
    });

    async function authorizeMultiplayer(register) {
      const endpoint = document.getElementById('server-endpoint').value.trim();
      const profile = document.getElementById('credential-profile').value.trim();
      if (!endpoint) {
        setConnectionError('SERVER ADDRESS REQUIRED');
        return;
      }
      if (!profile) {
        setConnectionError('CREDENTIAL PROFILE REQUIRED');
        return;
      }
      if (!/^[A-Za-z0-9_-]{1,64}$/.test(profile)) {
        setConnectionError('PROFILE MAY USE ONLY A-Z, 0-9, _ AND -');
        return;
      }
      setConnectionError('');
      await sendCommand(
        (register ? 'multiplayer_register|' : 'multiplayer_signin|') +
        endpoint + '|' + profile
      );
    }

    for (const id of ['server-endpoint', 'credential-profile']) {
      document.getElementById(id).addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          authorizeMultiplayer(false);
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          showMainMenu();
        }
      });
    }
  </script>
</body>
</html>
