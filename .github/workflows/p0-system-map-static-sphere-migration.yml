name: P0 System Map Static Sphere Migration

on:
  push:
    branches:
      - chatgpt/mae-v01075-semantic-workflow-motion-v5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply static sphere migration
        run: python tools/p0_system_map_static_sphere_migrate.py
      - name: Static sphere architecture contract
        run: python tests/architecture_contracts/check_system_map_static_sphere.py
      - name: GL43 Core boundary
        run: python tests/architecture_contracts/check_gl43_modernization_boundary.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit migration result
        shell: bash
        run: |
          git config user.name 'Kostiantyn Zubchenko [FE-30]'
          git config user.email '90088507+forzub@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git commit -m 'render: move System Map textured spheres to static GPU meshes'
          git push origin HEAD:chatgpt/mae-v01075-semantic-workflow-motion-v5
