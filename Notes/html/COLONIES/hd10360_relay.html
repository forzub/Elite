## Почему здесь

<!-- NARRATIVE:why_there -->
Аванпост гипер-эпохи, не колония корабля. В 2840–2860 годах дальность прыжка была 18–26 св. лет (CANON хронологии маяков), и до HD 40307 нельзя было дойти одним прыжком; HD 10360 стал промежуточным маяком — «мост к HD 40307» (CANON: «Мосты к HD 40307 через HD 10360»). Совладельцы — [Вторая Эллада](hd20794_hellas2.md) (строила маяк) и [Новая Маланд](hd40307_maland.md) (ей мост нужнее всего: пища уходит по нему на рынки ядра) [PROPOSAL — распределение ролей].

Система — двойная звезда (p Eridani A и HD 10360). По каталогу:
- **p Eridani A k** — водный мир 3.3 M⊕ на 0.73 а.е., ~271 K, плотная атмосфера ~24 бар N₂/H₂O, подлёдный океан, g ~13 м/с². Вода и газ под рукой, но тяжело и душно.
- **p Eridani A n** (1.76 M⊕, ~102 K) и **o** (0.34 M⊕, ~66 K) — холодные миры с атмосферой N₂/CH₄ (5 бар), лёд и метан.
- внутренние скалистые планеты обеих звёзд — горячие, без атмосферы; два ледяных пояса.

Ресурсы здесь — побочный доход. Причина места — геометрия сети.

## Прибытие и первое поселение

<!-- NARRATIVE:arrival -->
2840: Вторая Эллада высаживает 100 человек (событие в данных) — техников маяка. Модель в том же году показывает 946 человек при чистой миграции 890 ‰: первые годы — это вахты и наёмные экипажи, а не поселенцы. Первое жильё [PROPOSAL]: герметичная станция маяка на орбите k и опорный модуль на поверхности k для добычи воды — тяжёлое тело, но плотная атмосфера и вода избавляют от доставки льда. Власти как таковой нет: начальник маяка от эллинской портовой компании и представитель Маланда.

Рост дала миграция (приток 2750–3126 — 27 190, отток — 127), а не рождаемость: люди ехали туда, где работа есть, а жильё дешевле, чем в узлах ядра. Хабитат за всю историю — герметичные станции и укрытые модули; ни выработок, ни цилиндров. Дочерние поселения на n и o [PROPOSAL]: метановые и ледовые промыслы для заправки кораблей. Горькая деталь: аванпост рос, пока его причина исчезала — с 2950 года дальность прыжка 32 св. года, и часть рейсов к HD 40307 может обходить мост [PROPOSAL — следствие из хронологии; точная геометрия маршрутов — в навигационных данных].
